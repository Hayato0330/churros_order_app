<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ソフテニチュロス注文</title>

<style>
  :root { --btn-size: 3.1rem; --gap: .8rem; }
  body {
    margin: 0; background: #fff; color: #222;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    padding: 1.2rem clamp(12px, 4vw, 28px) calc(1.2rem + env(safe-area-inset-bottom,0));
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 {
    margin: 0 0 1.3rem 0;
    text-align: center;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 800;
    letter-spacing: .05em;
    padding-top: .6em; /* タイトルを半文字分下げる */
  }

  .flavor { margin: 1.2rem 0; }
  .label {
    text-align: center;
    font-weight: 700;
    font-size: 1.25rem;
    margin-bottom: .3rem;
  }
  .label.choco { color: #8B4513; }
  .label.strawberry { color: #E60033; }

  .row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: var(--gap);
  }
  .btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-width: var(--btn-size);
    height: var(--btn-size);
    border-radius: 12px;
    border: 1px solid #e4e6eb;
    background: #f7f8fa;
    font-size: 1.35rem;
    font-weight: 800;
    user-select: none;
    touch-action: manipulation;
  }
  .btn:active {
    transform: scale(.97);
    background: #eceff3;
  }
  .btn[disabled] {
    opacity: .4;
    pointer-events: none;
  }

  .count {
    min-width: 3rem;
    text-align: center;
    font-size: 1.45rem;
    font-weight: 800;
  }

  .complete {
    width: 100%;
    margin-top: 1.7rem;
    height: 3.2rem;
    background: #0b70ff;
    color: #fff;
    border: none;
    font-weight: 800;
    font-size: 1.15rem;
    border-radius: 10px;
  }
  .complete:active { transform: scale(.99); }

  /* ===== モーダル ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.42);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    z-index: 9999;
  }
  .modal {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,.18);
  }
  .modal-header {
    font-weight: 800;
    font-size: 1.1rem;
    padding: 1rem;
    text-align: center;
    border-bottom: 1px solid #eee;
  }
  .modal-body {
    padding: 1.1rem;
    line-height: 1.65;
    white-space: pre-line;
  }
  .modal-actions {
    display: flex;
    gap: .6rem;
    padding: 1rem;
    border-top: 1px solid #eee;
  }
  .modal-actions .btn {
    flex: 1;
    height: 2.8rem;
    font-size: 1rem;
    border-radius: 10px;
  }
  .btn-primary {
    background: #0b70ff;
    color: #fff;
    border-color: #0b70ff;
  }
  .btn-ghost {
    background: #f5f6f8;
    color: #222;
    border-color: #e5e7eb;
  }
</style>
</head>

<body>
  <main class="container">
    <h1>ソフテニチュロス注文</h1>

    <!-- ▼ プレーン -->
    <section class="flavor" data-key="plain">
      <div class="label">プレーン</div>
      <div class="row">
        <button class="btn dec">◀</button>
        <div class="count">0</div>
        <button class="btn inc">▶</button>
      </div>
    </section>

    <!-- ▼ チョコ -->
    <section class="flavor" data-key="choco">
      <div class="label choco">チョコ</div>
      <div class="row">
        <button class="btn dec">◀</button>
        <div class="count">0</div>
        <button class="btn inc">▶</button>
      </div>
    </section>

    <!-- ▼ ストロベリー -->
    <section class="flavor" data-key="strawberry">
      <div class="label strawberry">ストロベリー</div>
      <div class="row">
        <button class="btn dec">◀</button>
        <div class="count">0</div>
        <button class="btn inc">▶</button>
      </div>
    </section>

    <button class="complete" id="open-confirm">完了</button>
  </main>

  <!-- ====== ポップアップ ====== -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-header" id="modal-title">確認</div>
      <div class="modal-body" id="modal-message"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">戻る</button>
        <button class="btn btn-primary" id="modal-confirm" data-mode="confirm">確定</button>
      </div>
    </div>
  </div>

<script>
  /* 減ボタンの有効・無効を同期 */
  function sync(flavor) {
    const count = Number(flavor.querySelector('.count').textContent) || 0;
    flavor.querySelector('.dec').disabled = count <= 0;
  }

  /* カウント操作 */
  document.querySelectorAll('.flavor').forEach(f => {
    const countEl = f.querySelector('.count');
    const decBtn = f.querySelector('.dec');
    const incBtn = f.querySelector('.inc');

    decBtn.addEventListener('click', () => {
      let v = Number(countEl.textContent) || 0;
      if (v > 0) countEl.textContent = v - 1;
      sync(f);
    });

    incBtn.addEventListener('click', () => {
      let v = Number(countEl.textContent) || 0;
      countEl.textContent = v + 1;
      sync(f);
    });

    sync(f);
  });

  function getCounts() {
    return {
      plain: Number(document.querySelector('[data-key="plain"] .count').textContent) || 0,
      choco: Number(document.querySelector('[data-key="choco"] .count').textContent) || 0,
      straw: Number(document.querySelector('[data-key="strawberry"] .count').textContent) || 0
    };
  }

  const modal = document.getElementById('modal');
  const titleEl = document.getElementById('modal-title');
  const msgEl = document.getElementById('modal-message');
  const cancelBtn = document.getElementById('modal-cancel');
  const confirmBtn = document.getElementById('modal-confirm');

  function openModal() {
    const { plain, choco, straw } = getCounts();
    const total = plain + choco + straw;

    if (total === 0) {
      alert('プレーン・チョコ・ストロベリーのいずれかを1つ以上選んでください。');
      return;
    }

    // 確認モードに初期化
    titleEl.textContent = '確認';
    msgEl.textContent = `プレーン×${plain}\nチョコ×${choco}\nストロベリー×${straw}\nでいいですか？`;
    confirmBtn.textContent = '確定';
    confirmBtn.dataset.mode = 'confirm';

    modal.style.display = 'flex';
  }

  function closeModal() {
    modal.style.display = 'none';
  }

  document.getElementById('open-confirm').addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);

  /* 注文送信 → 完了ポップアップに切り替え */
  async function postOrder() {
    const { plain, choco, straw } = getCounts();

    try {
      const res = await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          plain,
          choco,
          strawberry: straw
        })
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok && data && data.ok) {
        // 成功時：完了メッセージに切り替え
        titleEl.textContent = '完了';
        msgEl.textContent =
          `ご注文を受け付けました。\n注文番号：${data.id}\nこの番号をスタッフにお見せください。`;

        // カウントをリセット
        document.querySelectorAll('.count').forEach(c => (c.textContent = '0'));
        document.querySelectorAll('.dec').forEach(b => (b.disabled = true));

        cancelBtn.style.display = "none";
        confirmBtn.textContent = '閉じる';
        confirmBtn.dataset.mode = 'close';
      } else {
        titleEl.textContent = 'エラー';
        msgEl.textContent = '送信に失敗しました。もう一度お試しください。';
        confirmBtn.textContent = '閉じる';
        confirmBtn.dataset.mode = 'close';
      }
    } catch (e) {
      titleEl.textContent = '通信エラー';
      msgEl.textContent = 'ネットワークエラーが発生しました。';
      confirmBtn.textContent = '閉じる';
      confirmBtn.dataset.mode = 'close';
    }
  }

  /* 確定／閉じるボタンの挙動 */
  confirmBtn.addEventListener('click', () => {
    const mode = confirmBtn.dataset.mode || 'confirm';  // ★ ここが重要

    if (mode === 'confirm') {
      // 確認状態 → 注文を送信して完了画面へ
      postOrder();
    } else {
      // 完了状態 → 閉じる
      closeModal();
    }
  });

  /* 背景タップ・Escキーで閉じる */
  modal.addEventListener('click', e => {
    if (e.target === modal) closeModal();
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.style.display === 'flex') closeModal();
  });
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>チュロス管理画面</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    #status {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* 2列レイアウト */
    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 左右２列 */
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 枠スタイル */
    .order-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-left: 6px solid #4caf50;
    }

    .order-id {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .order-detail {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .btn-area {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.1s ease, background-color 0.1s ease;
    }

    .btn-pay {
      background: #00bcd4;
      color: white;
    }

    .btn-serve {
      background: #ff9800;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    button.disabled {
      background: #ccc !important;
      cursor: default;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>注文管理画面</h1>
  <p id="status">読み込み中…</p>

  <!-- ★ 2列グリッドレイアウト -->
  <div class="order-grid"></div>

  <script>
    // ★注文用アプリのURLに合わせる
    // 例: https://softeni-churros.pages.dev/api
    const API_BASE = "https://churros-order-app.pages.dev/api";

    const statusEl = document.getElementById("status");
    const grid = document.querySelector(".order-grid");

    async function loadOrders() {
        try {
        statusEl.textContent = "読み込み中…";

        const res = await fetch(`${API_BASE}/orders`);
        if (!res.ok) {
            statusEl.textContent = `エラー: ${res.status} ${res.statusText}`;
            console.error("HTTP error", res.status, res.statusText);
            return;
        }

        const list = await res.json();  // ← さっきの配列そのもの

        console.log("orders response:", list);

        grid.innerHTML = "";

        if (!Array.isArray(list) || list.length === 0) {
            statusEl.textContent = "未会計または未提供の注文はありません．";
            return;
        }

        statusEl.textContent = "";

        list.forEach(order => {
            const card = document.createElement("div");
            card.className = "order-card";

            const paidClass = order.paid ? "disabled" : "";
            const servedClass = order.served ? "disabled" : "";

            card.innerHTML = `
            <div class="order-id">注文番号：${order.id}</div>
            <div class="order-detail">
                プレーン × ${order.plain}<br>
                チョコ × ${order.choco}<br>
                ストロベリー × ${order.strawberry}
            </div>
            <div class="btn-area">
                <button class="btn-pay ${paidClass}" data-id="${order.id}">会計完了</button>
                <button class="btn-serve ${servedClass}" data-id="${order.id}">提供完了</button>
            </div>
            `;
            grid.appendChild(card);
        });

        setButtonEvents();
        } catch (e) {
        statusEl.textContent = "注文一覧の取得に失敗しました．ブラウザのコンソールも確認してください．";
        console.error("注文一覧の取得に失敗", e);
        }
    }

    function setButtonEvents() {
        document.querySelectorAll(".btn-pay").forEach(btn => {
        if (btn.classList.contains("disabled")) return;
        btn.onclick = async () => {
            const id = Number(btn.dataset.id);
            btn.classList.add("disabled");
            try {
            await fetch(`${API_BASE}/paid`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id }),
            });
            loadOrders();
            } catch (e) {
            console.error("会計更新に失敗", e);
            }
        };
        });

        document.querySelectorAll(".btn-serve").forEach(btn => {
        if (btn.classList.contains("disabled")) return;
        btn.onclick = async () => {
            const id = Number(btn.dataset.id);
            btn.classList.add("disabled");
            try {
            await fetch(`${API_BASE}/served`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id }),
            });
            loadOrders();
            } catch (e) {
            console.error("提供更新に失敗", e);
            }
        };
        });
    }

    loadOrders();
    setInterval(loadOrders, 10000);
  </script>

 </body>
</html>

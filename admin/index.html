<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>チュロス管理画面</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    /* 2列レイアウト */
    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 左右２列 */
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 枠スタイル */
    .order-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-left: 6px solid #4caf50;
    }

    .order-id {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .order-detail {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .btn-area {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-pay {
      background: #00bcd4;
      color: white;
    }

    .btn-serve {
      background: #ff9800;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <h1>注文管理画面（UIテスト）</h1>

  <!-- ★ 2列グリッドレイアウト -->
  <div class="order-grid">

    <!-- 注文1 -->
    <div class="order-card">
      <div class="order-id">注文番号：1</div>
      <div class="order-detail">
        プレーン × 2<br>
        チョコ × 1<br>
        ストロベリー × 0
      </div>
      <div class="btn-area">
        <button class="btn-pay">会計完了</button>
        <button class="btn-serve">提供完了</button>
      </div>
    </div>

    <!-- 注文2 -->
    <div class="order-card">
      <div class="order-id">注文番号：2</div>
      <div class="order-detail">
        プレーン × 0<br>
        チョコ × 3<br>
        ストロベリー × 1
      </div>
      <div class="btn-area">
        <button class="btn-pay">会計完了</button>
        <button class="btn-serve">提供完了</button>
      </div>
    </div>

    <!-- 注文3 -->
    <div class="order-card">
      <div class="order-id">注文番号：3</div>
      <div class="order-detail">
        プレーン × 1<br>
        チョコ × 0<br>
        ストロベリー × 2
      </div>
      <div class="btn-area">
        <button class="btn-pay">会計完了</button>
        <button class="btn-serve">提供完了</button>
      </div>
    </div>

    <!-- 注文4 -->
    <div class="order-card">
      <div class="order-id">注文番号：4</div>
      <div class="order-detail">
        プレーン × 4<br>
        チョコ × 2<br>
        ストロベリー × 1
      </div>
      <div class="btn-area">
        <button class="btn-pay">会計完了</button>
        <button class="btn-serve">提供完了</button>
      </div>
    </div>

    <!-- 注文5 -->
    <div class="order-card">
      <div class="order-id">注文番号：5</div>
      <div class="order-detail">
        プレーン × 1<br>
        チョコ × 1<br>
        ストロベリー × 1
      </div>
      <div class="btn-area">
        <button class="btn-pay">会計完了</button>
        <button class="btn-serve">提供完了</button>
      </div>
    </div>

  </div>

</body>
</html>

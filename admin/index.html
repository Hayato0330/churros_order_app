<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>チュロス管理画面</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    /* 2列レイアウト */
    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 左右２列 */
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 枠スタイル */
    .order-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-left: 6px solid #4caf50;
    }

    .order-id {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .order-detail {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .btn-area {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-pay {
      background: #00bcd4;
      color: white;
    }

    .btn-serve {
      background: #ff9800;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <h1>注文管理画面（UIテスト）</h1>

  <!-- ★ 2列グリッドレイアウト -->
  <div class="order-grid">
  </div>

  <script>
        const API_BASE = "/api";

        // -----------------------
        // 注文一覧取得
        // -----------------------
        async function loadOrders() {
        const res = await fetch(`${API_BASE}/orders`);
        const list = await res.json();

        const grid = document.querySelector(".order-grid");
        grid.innerHTML = ""; // 一度クリア

        list.forEach(order => {
            const card = document.createElement("div");
            card.className = "order-card";
            card.innerHTML = `
            <div class="order-id">注文番号：${order.id}</div>
            <div class="order-detail">
                プレーン × ${order.plain}<br>
                チョコ × ${order.choco}<br>
                ストロベリー × ${order.strawberry}
            </div>
            <div class="btn-area">
                <button class="btn-pay" data-id="${order.id}" ${order.paid ? "style='background:#ccc'" : ""}>会計完了</button>
                <button class="btn-serve" data-id="${order.id}" ${order.served ? "style='background:#ccc'" : ""}>提供完了</button>
            </div>
            `;
            grid.appendChild(card);
        });

        // ボタンイベント再セット
        setButtonEvents();
        }

        // -----------------------
        // ボタン動作
        // -----------------------
        function setButtonEvents() {
        document.querySelectorAll(".btn-pay").forEach(btn => {
            btn.onclick = async () => {
            btn.style.background = "#ccc";
            await fetch(`${API_BASE}/paid`, {
                method: "POST",
                body: JSON.stringify({ id: btn.dataset.id })
            });
            loadOrders();
            };
        });

        document.querySelectorAll(".btn-serve").forEach(btn => {
            btn.onclick = async () => {
            btn.style.background = "#ccc";
            await fetch(`${API_BASE}/served`, {
                method: "POST",
                body: JSON.stringify({ id: btn.dataset.id })
            });
            loadOrders();
            };
        });
        }

        // -----------------------
        // 初回読み込み
        // -----------------------
        loadOrders();

        // -----------------------
        // 60秒に1回だけポーリング
        // Cloudflare無料枠を絶対超えない
        // -----------------------
        setInterval(loadOrders, 10000);
    </script>


</body>
</html>

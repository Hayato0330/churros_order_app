<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ソフテニチュロス注文</title>
<style>
  :root { --gap: 0.8rem; --btn-size: 3.2rem; --radius: 12px; }
  html, body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; }
  body {
    padding: 1.2rem clamp(12px, 4vw, 28px) calc(1.2rem + env(safe-area-inset-bottom, 0));
    background: #fff;
    color: #222;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { 
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 800; letter-spacing: .05em; text-align: center;
    margin: 0 0 1.2rem 0;
    padding-top: .6em; /* タイトルを“半文字”下げるニュアンス */
  }

  /* フレーバーブロック：上段=ラベル, 下段=ボタン行（中央揃え） */
  .flavor { margin: 1.0rem 0; }
  .label { 
    text-align: center; font-weight: 700;
    font-size: clamp(1.1rem, 4.6vw, 1.35rem);
    margin-bottom: .4rem;
  }
  .label.choco { color: #8B4513; }
  .label.strawberry { color: #E60033; }

  .row {
    display: flex; align-items: center; justify-content: center;
    gap: var(--gap);
  }
  .btn {
    min-width: var(--btn-size); height: var(--btn-size);
    border-radius: var(--radius);
    border: 1px solid #e4e6eb; background: #f7f8fa;
    font-size: clamp(1.1rem, 5vw, 1.4rem); font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    touch-action: manipulation; user-select: none;
  }
  .btn:active { transform: scale(.98); background: #eceff3; }
  .btn[disabled] { opacity: .45; pointer-events: none; }

  .count {
    min-width: 3.2rem; text-align: center;
    font-weight: 800; font-size: clamp(1.2rem, 5.5vw, 1.5rem);
  }

  .order {
    margin-top: 1.6rem;
    width: 100%; height: 3.2rem;
    background: #0b70ff; color: #fff; border: none;
    border-radius: 10px; font-weight: 800;
    font-size: clamp(1.0rem, 4.8vw, 1.2rem);
  }
  .order:active { transform: scale(.99); }
</style>
</head>
<body>
  <main class="container">
    <h1>ソフテニチュロス注文</h1>

    <section class="flavor" data-key="plain">
      <div class="label">プレーン</div>
      <div class="row">
        <button class="btn dec" aria-label="プレーンを1減らす">◀</button>
        <div class="count" aria-live="polite">0</div>
        <button class="btn inc" aria-label="プレーンを1増やす">▶</button>
      </div>
    </section>

    <section class="flavor" data-key="choco">
      <div class="label choco">チョコ</div>
      <div class="row">
        <button class="btn dec" aria-label="チョコを1減らす">◀</button>
        <div class="count" aria-live="polite">0</div>
        <button class="btn inc" aria-label="チョコを1増やす">▶</button>
      </div>
    </section>

    <section class="flavor" data-key="strawberry">
      <div class="label strawberry">ストロベリー</div>
      <div class="row">
        <button class="btn dec" aria-label="ストロベリーを1減らす">◀</button>
        <div class="count" aria-live="polite">0</div>
        <button class="btn inc" aria-label="ストロベリーを1増やす">▶</button>
      </div>
    </section>

    <button class="order">注文</button>
  </main>

<script>
  // 0未満禁止・左ボタンは0で無効化
  function sync(flavor) {
    const countEl = flavor.querySelector('.count');
    const dec = flavor.querySelector('.dec');
    const value = parseInt(countEl.textContent, 10) || 0;
    dec.disabled = value <= 0;
  }

  document.querySelectorAll('.flavor').forEach(flavor => {
    const countEl = flavor.querySelector('.count');
    const dec = flavor.querySelector('.dec');
    const inc = flavor.querySelector('.inc');

    dec.addEventListener('click', () => {
      let v = parseInt(countEl.textContent, 10) || 0;
      if (v > 0) countEl.textContent = String(v - 1);
      sync(flavor);
    });

    inc.addEventListener('click', () => {
      let v = parseInt(countEl.textContent, 10) || 0;
      countEl.textContent = String(v + 1);
      sync(flavor);
    });

    sync(flavor); // 初期同期
  });
</script>
</body>
</html>

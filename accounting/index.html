<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>チュロス売上確認</title>

  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; margin-bottom: 30px; }
    h2 { margin-top: 35px; }

    .section {
      background: white;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
    }
    button {
      cursor: pointer;
      background: #0288d1;
      color: white;
      border: none;
    }
    button:hover { opacity: 0.85; }
    .row { margin-bottom: 12px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    table th, table td {
      border-bottom: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    table th { background: #f0f0f0; }
    .total-box {
      font-size: 24px;
      font-weight: bold;
      text-align: right;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>チュロス売上確認</h1>

  <!-- ▼ 基本価格の設定 -->
  <div class="section">
    <h2>基本価格の設定</h2>
    <div class="row">
      プレーン：<input type="number" id="base-plain"> 円
    </div>
    <div class="row">
      チョコ：<input type="number" id="base-choco"> 円
    </div>
    <div class="row">
      ストロベリー：<input type="number" id="base-strawberry"> 円
    </div>
    <button onclick="saveBasePrice()">保存</button>

    <h3 style="margin-top:25px">現在の基本価格</h3>
    <div id="current-base"></div>
  </div>

  <!-- ▼ 値下げ価格の登録 -->
  <div class="section">
    <h2>値下げ価格の登録</h2>
    <div class="row">
      適用日時：<input type="datetime-local" id="discount-date">
    </div>
    <div class="row">
      プレーン：<input type="number" id="discount-plain"> 円
    </div>
    <div class="row">
      チョコ：<input type="number" id="discount-choco"> 円
    </div>
    <div class="row">
      ストロベリー：<input type="number" id="discount-strawberry"> 円
    </div>
    <button onclick="saveDiscountPrice()">保存</button>
  </div>

  <!-- ▼ 売上確認 -->
  <div class="section">
    <h2>売上確認</h2>
    日付を選択：<input type="date" id="sales-date">
    <button onclick="loadSales()">表示</button>

    <table id="sales-table" style="display:none">
      <thead>
        <tr>
          <th>区分</th>
          <th>プレーン</th>
          <th>チョコ</th>
          <th>ストロベリー</th>
          <th>売上金額</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="total-box" id="sales-total" style="display:none"></div>
  </div>

<script>
const API = "/api";

// ▼ 現在の基本価格読み込み
async function loadBasePrice() {
  const res = await fetch(`${API}/base_price`);
  const data = await res.json();
  if (!data) return;

  document.getElementById("current-base").innerHTML = `
    プレーン：${data.plain} 円　
    チョコ：${data.choco} 円　
    ストロベリー：${data.strawberry} 円
  `;

  document.getElementById("base-plain").value = data.plain;
  document.getElementById("base-choco").value = data.choco;
  document.getElementById("base-strawberry").value = data.strawberry;
}

// ▼ 基本価格保存
async function saveBasePrice() {
  const body = {
    plain: Number(document.getElementById("base-plain").value),
    choco: Number(document.getElementById("base-choco").value),
    strawberry: Number(document.getElementById("base-strawberry").value),
  };
  await fetch(`${API}/base_price`, { method:"POST", body: JSON.stringify(body) });
  alert("保存しました");
  loadBasePrice();
}

// ▼ 値下げ価格保存
async function saveDiscountPrice() {
  const body = {
    apply_at: document.getElementById("discount-date").value,
    plain: Number(document.getElementById("discount-plain").value),
    choco: Number(document.getElementById("discount-choco").value),
    strawberry: Number(document.getElementById("discount-strawberry").value),
  };
  await fetch(`${API}/pricehistory`, { method:"POST", body: JSON.stringify(body) });
  alert("保存しました");
}

async function loadLatestDiscount() {
  const res = await fetch(`${API}/pricehistory?latest=1`);
  const data = await res.json();
  if (!data) return;

  document.getElementById("discount-date").value = data.apply_at.slice(0,16);
  document.getElementById("discount-plain").value = data.plain;
  document.getElementById("discount-choco").value = data.choco;
  document.getElementById("discount-strawberry").value = data.strawberry;
}

// ▼ 日別売上表示
async function loadSales() {
  const date = document.getElementById("sales-date").value;
  if (!date) {
    alert("日付を選択してください");
    return;
  }

  const res = await fetch(`${API}/sales?date=${date}`);
  const data = await res.json();

  const table = document.getElementById("sales-table");
  const tbody = table.querySelector("tbody");
  const totalBox = document.getElementById("sales-total");
  tbody.innerHTML = ""; // 初期化

  table.style.display = "table";
  totalBox.style.display = "block";

  // 基本価格計算売上
  tbody.innerHTML += `
    <tr>
      <td>基本価格</td>
      <td>${data.basic.count.plain}</td>
      <td>${data.basic.count.choco}</td>
      <td>${data.basic.count.strawberry}</td>
      <td>${data.basic.total} 円</td>
    </tr>
  `;

  // 値下げ後計算売上
  tbody.innerHTML += `
    <tr>
      <td>値下げ後</td>
      <td>${data.discount.count.plain}</td>
      <td>${data.discount.count.choco}</td>
      <td>${data.discount.count.strawberry}</td>
      <td>${data.discount.total} 円</td>
    </tr>
  `;

  totalBox.innerHTML = `合計：${data.total} 円`;
}

// 初期処理
loadBasePrice();
loadLatestDiscount();

</script>
</body>
</html>
